apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: dice
spec:
  ingressClassName: nginx
  namespace: default 
  rules:
  - host: job.127.0.0.1.nip.io
  - http:
      paths:
      - path: /candidate 
        pathType: Prefix 
        backend:
          service:
            name: candidate-service
            port:
              number: 8080
      - path: /job 
        pathType: Prefix 
        backend:
          service:
            name: job-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend: 
          service:
            name: frontend-service
            port:
              number: 80
