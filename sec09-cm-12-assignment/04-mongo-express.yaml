apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-app
spec:
  selector:
    matchLabels:
      app: mongo-app
  replicas: 1
  template:
    metadata:
      labels:
        app: mongo-app
    spec:
      restartPolicy: Always
      containers:
      - name: mongo-app
        image:  mongo-express:1.0.0-alpha.4
        ports:
        - containerPort: 8081
          name: "mongo-port"
        env:
        - name: "ME_CONFIG_MONGODB_ADMINUSERNAME"
          valueFrom: 
            secretKeyRef:
              name: mongo-secret
              key: username
        - name: "ME_CONFIG_MONGODB_ADMINPASSWORD"
          valueFrom: 
            secretKeyRef:
              name: mongo-secret
              key: password
        - name: "ME_CONFIG_MONGODB_SERVER"
          value: "mongo"
        - name: ME_CONFIG_MONGODB_PORT
          value: "27017"
        - name: ME_CONFIG_MONGODB_AUTH_DATABASE
          value: admin

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
spec:
  selector:
    app: mongo-app
  ports:
  - port: 8081
    targetPort: 8081
