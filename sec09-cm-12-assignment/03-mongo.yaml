
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  selector:
    matchLabels:
      app: mongo
  replicas: 1
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:4.4-focal
        volumeMounts:
        - name: init-data
          mountPath: /docker-entrypoint-initdb.d 
        ports:
          - containerPort: 27017
            name: "mongo-port"
        env:
        - name: "MONGO_INITDB_ROOT_USERNAME"
          valueFrom: 
            secretKeyRef:
              name: mongo-secret
              key: username
        - name: "MONGO_INITDB_ROOT_PASSWORD"
          valueFrom: 
            secretKeyRef:
              name: mongo-secret
              key: password
      volumes:
      - name: init-data
        configMap:
          name: mongo-properties 

---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017